name: mini_cdp
version: "1.0.0"
profile: mini_cdp

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
# Airflow 容器內專案為唯讀掛載，套件改裝到可寫目錄
packages-install-path: "{{ env_var('DBT_PACKAGES_DIR', 'dbt_packages') }}"

models:
  mini_cdp:
    staging:
      +schema: cdp_staging
      +materialized: view
    marts:
      +schema: cdp_marts
      +materialized: table
